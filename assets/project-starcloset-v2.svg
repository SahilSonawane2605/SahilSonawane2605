<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p3-t">
  <title id="p3-t">MnemOS — Agentic Learning Digital Twins: Learning-memory prototype for intelligent personalized learning.</title>
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B22"/><stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="p3-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".6"/><stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p3-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#00D9FF" stroke-opacity=".06"/>
    </pattern>
    <filter id="p3-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p3-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p3-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00FFA3"/><stop offset=".45" stop-color="#00D9FF"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p3-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p3-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p3-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p3-in { animation: p3-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p3-d1 { animation-delay: .15s; } .p3-d2 { animation-delay: .4s; }
    .p3-chip { animation: p3-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p3-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p3-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p3-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p3-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p3-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p3-in, .p3-chip { animation: none; } .p3-draw { animation: none; stroke-dashoffset: 0; } }
    .p3-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p3-trace 7s linear infinite; }
    @keyframes p3-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p3-trace { display: none; } }
  </style>
  <g clip-path="url(#p3-clip)">
    <rect width="1200" height="370" fill="url(#p3-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p3-grid)"/>
    <rect width="1200" height="370" fill="url(#p3-glow)"/>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#30363D" stroke-opacity=".8"/>
    <rect class="p3-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p3-trace)" stroke-width="1.8" stroke-linecap="round"/>
    <g class="p3-in p3-d1">
      <text class="p3-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#00D9FF">03 · AI/ML · RESEARCH PROTOTYPE · 2026</text>
      <text class="p3-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F0F6FC">MnemOS<tspan class="p3-serif" font-size="20" font-style="italic" fill="#00FFA3" dx="14">Agentic Learning Digital Twins</tspan></text>
      <text class="p3-sans" x="56" y="166" font-size="17" fill="#8B949E">Learning-memory prototype for capture, storage, retrieval, and AI assistance.</text>
      <text class="p3-mono" x="56" y="200" font-size="12.5" fill="#00FFA3"><tspan fill="#00D9FF">RESEARCH TOPIC ›</tspan> Agentic Learning Digital Twins — Intelligent Personalized Learning Framework</text>
      <line class="p3-draw" x1="56" y1="226" x2="680" y2="226" stroke="#30363D" stroke-width="1.2"/>
    <g transform="translate(56 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#F0F6FC">Context</text><text class="p3-sans" y="24" font-size="12.5" fill="#8B949E">capture &amp; timeline retrieval</text></g>
    <g transform="translate(261 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#F0F6FC">Gemini</text><text class="p3-sans" y="24" font-size="12.5" fill="#8B949E">API-assisted learning tutor</text></g>
    <g transform="translate(466 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#F0F6FC">Framework</text><text class="p3-sans" y="24" font-size="12.5" fill="#8B949E">intelligent digital twin</text></g>
      <g class="p3-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="65" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p3-mono" x="88" y="331" text-anchor="middle" font-size="11.5" fill="#00D9FF">Python</text></g>
      <g class="p3-chip" style="animation-delay:1.12s"><rect x="129" y="314" width="70" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p3-mono" x="164" y="331" text-anchor="middle" font-size="11.5" fill="#00D9FF">FastAPI</text></g>
      <g class="p3-chip" style="animation-delay:1.24s"><rect x="207" y="314" width="60" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p3-mono" x="237" y="331" text-anchor="middle" font-size="11.5" fill="#00D9FF">SQLite</text></g>
      <g class="p3-chip" style="animation-delay:1.36s"><rect x="275" y="314" width="90" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p3-mono" x="320" y="331" text-anchor="middle" font-size="11.5" fill="#00FFA3">Gemini API</text></g>
      <g class="p3-chip" style="animation-delay:1.48s"><rect x="373" y="314" width="55" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p3-mono" x="400" y="331" text-anchor="middle" font-size="11.5" fill="#00D9FF">AI/ML</text></g>
    </g>
    <!-- Right side illustration: Memory Graph & Knowledge Retrieval -->
    <g class="p3-in p3-d2"><g transform="translate(0 35)">
      <g>
        <rect x="760" y="50" width="280" height="38" rx="12" fill="#161B22" stroke="#00D9FF" stroke-opacity=".5"/>
        <text class="p3-mono" x="776" y="74" font-size="12" fill="#F0F6FC">“recall: graph algorithms context”</text>
        <g transform="translate(760 112)">
          <!-- Node 1: Capture -->
          <rect width="80" height="58" rx="9" fill="#161B22" stroke="#30363D">
            <animate attributeName="stroke" values="#30363D;#00D9FF;#30363D" dur="4s" repeatCount="indefinite"/>
          </rect>
          <text class="p3-mono" x="40" y="34" font-size="11" text-anchor="middle" fill="#00D9FF">Capture</text>
          <!-- Node 2: SQLite Timeline -->
          <g transform="translate(95 0)">
            <rect width="80" height="58" rx="9" fill="#161B22" stroke="#30363D"/>
            <text class="p3-mono" x="40" y="34" font-size="11" text-anchor="middle" fill="#8B949E">Storage</text>
          </g>
          <!-- Node 3: Gemini Assist -->
          <g transform="translate(190 0)">
            <rect width="90" height="58" rx="9" fill="#0D1117" stroke="#7C3AED" stroke-width="1.5">
              <animate attributeName="stroke" values="#7C3AED;#00FFA3;#7C3AED" dur="4s" begin="2s" repeatCount="indefinite"/>
            </rect>
            <text class="p3-mono" x="45" y="34" font-size="11" text-anchor="middle" fill="#00FFA3">Gemini</text>
          </g>
        </g>
        <!-- Connector line -->
        <path d="M760 200 H1040" stroke="#30363D" stroke-width="1"/>
        <circle cx="760" cy="200" r="3" fill="#00D9FF"/>
        <circle cx="855" cy="200" r="3" fill="#00D9FF"/>
        <circle cx="950" cy="200" r="3" fill="#00FFA3"/>
        <circle cx="1040" cy="200" r="3" fill="#7C3AED"/>
        <text class="p3-mono" x="760" y="224" font-size="11" fill="#8B949E">Digital Twin Memory Stream · Active</text>
      </g>
    </g></g>
  </g>
</svg>
