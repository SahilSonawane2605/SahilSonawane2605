<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p1-t">
  <title id="p1-t">SURAKSHA-SETU: Deterministic seven-factor disaster-risk assessment platform.</title>
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B22"/><stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="p1-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".6"/><stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p1-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#00D9FF" stroke-opacity=".06"/>
    </pattern>
    <filter id="p1-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p1-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p1-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00FFA3"/><stop offset=".45" stop-color="#00D9FF"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p1-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p1-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p1-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p1-in { animation: p1-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p1-d1 { animation-delay: .15s; } .p1-d2 { animation-delay: .4s; }
    .p1-chip { animation: p1-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p1-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p1-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p1-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p1-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p1-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1-in, .p1-chip { animation: none; } .p1-draw { animation: none; stroke-dashoffset: 0; } }
    .p1-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p1-trace 7s linear infinite; }
    @keyframes p1-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1-trace { display: none; } }
  </style>
  <g clip-path="url(#p1-clip)">
    <rect width="1200" height="370" fill="url(#p1-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p1-grid)"/>
    <rect width="1200" height="370" fill="url(#p1-glow)"/>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#30363D" stroke-opacity=".8"/>
    <rect class="p1-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p1-trace)" stroke-width="1.8" stroke-linecap="round"/>
    <g class="p1-in p1-d1">
      <text class="p1-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#00D9FF">02 · DETERMINISTIC GIS PLATFORM · SUPPORTING PROJECT · 2025</text>
      <text class="p1-serif" x="54" y="126" font-size="50" font-weight="300" letter-spacing="-1.5" fill="#F0F6FC">SURAKSHA-SETU</text>
      <text class="p1-sans" x="56" y="166" font-size="17" fill="#8B949E">Deterministic seven-factor disaster-risk assessment platform.</text>
      <text class="p1-mono" x="56" y="200" font-size="12.5" fill="#00FFA3"><tspan fill="#00D9FF">BUILT ›</tspan> GIS visualization, habitation prioritization, shelter capacity &amp; relocation analysis</text>
      <line class="p1-draw" x1="56" y1="226" x2="680" y2="226" stroke="#30363D" stroke-width="1.2"/>
    <g transform="translate(56 266)"><text class="p1-serif" font-size="34" font-weight="300" fill="#F0F6FC">7 Factors</text><text class="p1-sans" y="24" font-size="12.5" fill="#8B949E">deterministic evaluation</text></g>
    <g transform="translate(261 266)"><text class="p1-serif" font-size="34" font-weight="300" fill="#F0F6FC">GIS Map</text><text class="p1-sans" y="24" font-size="12.5" fill="#8B949E">spatial visualization</text></g>
    <g transform="translate(466 266)"><text class="p1-serif" font-size="34" font-weight="300" fill="#F0F6FC">Priority</text><text class="p1-sans" y="24" font-size="12.5" fill="#8B949E">shelter &amp; relocation analysis</text></g>
      <g class="p1-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p1-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#00D9FF">FastAPI</text></g>
      <g class="p1-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="60" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p1-mono" x="164" y="331" text-anchor="middle" font-size="11.5" fill="#00D9FF">SQLite</text></g>
      <g class="p1-chip" style="animation-delay:1.24s"><rect x="202" y="314" width="55" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p1-mono" x="229" y="331" text-anchor="middle" font-size="11.5" fill="#00D9FF">React</text></g>
      <g class="p1-chip" style="animation-delay:1.36s"><rect x="265" y="314" width="65" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p1-mono" x="297" y="331" text-anchor="middle" font-size="11.5" fill="#00D9FF">Leaflet</text></g>
      <g class="p1-chip" style="animation-delay:1.48s"><rect x="338" y="314" width="70" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p1-mono" x="373" y="331" text-anchor="middle" font-size="11.5" fill="#00D9FF">Shapely</text></g>
      <g class="p1-chip" style="animation-delay:1.60s"><rect x="416" y="314" width="118" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p1-mono" x="475" y="331" text-anchor="middle" font-size="11.5" fill="#00FFA3">OpenStreetMap</text></g>
    </g>
    <!-- Right side illustration: GIS Layers & Hazard Zone Graphic -->
    <g class="p1-in p1-d2"><g transform="translate(0 35)">
      <g transform="translate(840 40)">
        <!-- Layer 1 -->
        <rect x="-30" y="24" width="220" height="150" rx="10" fill="#161B22" stroke="#30363D" transform="rotate(-6 80 100)"/>
        <!-- Layer 2 -->
        <rect x="-10" y="16" width="220" height="150" rx="10" fill="#21262D" stroke="#7C3AED" stroke-opacity=".6" transform="rotate(-2 90 90)"/>
        <!-- Main GIS Map Viewport -->
        <g transform="rotate(3 100 80)">
          <rect x="10" y="10" width="230" height="160" rx="12" fill="#0D1117" stroke="#00D9FF" stroke-opacity=".7" stroke-width="1.5"/>
          <!-- Grid / contours -->
          <path d="M30 40 Q 70 80, 110 50 T 210 90" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity=".6"/>
          <path d="M25 80 Q 80 120, 140 70 T 220 120" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity=".7"/>
          <circle cx="80" cy="70" r="14" fill="#7C3AED" fill-opacity=".25" stroke="#7C3AED"/>
          <circle cx="80" cy="70" r="4" fill="#00FFA3"/>
          <circle cx="160" cy="90" r="22" fill="#00D9FF" fill-opacity=".2" stroke="#00D9FF"/>
          <circle cx="160" cy="90" r="5" fill="#00D9FF"/>
          <!-- Shelter pin -->
          <rect x="120" y="45" width="28" height="18" rx="4" fill="#00FFA3" fill-opacity=".2" stroke="#00FFA3"/>
          <text class="p1-mono" x="134" y="58" font-size="9" text-anchor="middle" fill="#00FFA3">SAFE</text>
          <!-- Hazard overlay pill -->
          <rect x="25" y="130" width="90" height="22" rx="11" fill="#161B22" stroke="#30363D"/>
          <text class="p1-mono" x="70" y="145" font-size="9" text-anchor="middle" fill="#00D9FF">7-FACTOR GIS</text>
        </g>
      </g>
    </g></g>
  </g>
</svg>
