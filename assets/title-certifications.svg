<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="06 Milestones: Verified milestones, on record.">
  <defs>
    <linearGradient id="tz-line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#00D9FF"/><stop offset=".6" stop-color="#7C3AED"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tz-sheen" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#00D9FF"/><stop offset=".5" stop-color="#F0F6FC"/><stop offset="1" stop-color="#7C3AED"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="tz-pulse"><stop offset="0" stop-color="#F0F6FC"/><stop offset=".5" stop-color="#00D9FF" stop-opacity=".6"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .tz-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .tz-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tz-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tz-in { animation: tz-in 1.1s cubic-bezier(.16,1,.3,1) both; }
    .tz-d2 { animation-delay: .2s; } .tz-d3 { animation-delay: .45s; }
    .tz-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: tz-draw 1.8s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes tz-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes tz-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .tz-in { animation: none; } .tz-draw { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g class="tz-in">
    <text class="tz-mono" x="40" y="34" font-size="12" letter-spacing="3" fill="#00D9FF"><tspan fill="#00FFA3">06</tspan>   MILESTONES</text>
  </g>
  <g class="tz-in tz-d2">
    <text class="tz-serif" x="38" y="84" font-size="44" font-weight="300" letter-spacing="-1" fill="#F0F6FC">Verified milestones, <tspan font-style="italic" fill="url(#tz-sheen)">on record.</tspan></text>
  </g>
  <g class="tz-in tz-d3">
    <text class="tz-mono" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#8B949E">SIH · FARAWAY · INNOVATEX · AAVISHKAR · CODEMBLE</text>
  </g>
  <path class="tz-draw" d="M40 106 H1160" stroke="url(#tz-line)" stroke-width="1"/>
  <circle cx="40" cy="106" r="7" fill="url(#tz-pulse)" opacity="0">
    <animate attributeName="cx" values="40;1160" dur="6s" begin="2.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" dur="6s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
</svg>
