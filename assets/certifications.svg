    <text class="ce-sans" x="22" y="130" font-size="14" fill="#00FFA3">Graduation: 2028</text>
  </g></g>

  <!-- Tile 7: RESEARCH -->
  <g class="ce-tile" style="animation-delay:0.92s"><g transform="translate(610 230)">
    <rect width="265" height="170" rx="14" fill="#161B22" stroke="#30363D"/>
    <rect width="265" height="170" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:4.10s"/>
    <text class="ce-mono" x="22" y="36" font-size="11.5" letter-spacing="2.6" fill="#00D9FF">RESEARCH</text>
    <circle cx="238" cy="31" r="3.5" fill="#00FFA3"/>
    <line x1="22" y1="54" x2="243" y2="54" stroke="#30363D"/>
