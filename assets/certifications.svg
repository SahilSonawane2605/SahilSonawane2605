    <rect width="265" height="170" rx="14" fill="#161B22" stroke="#30363D"/>
    <rect width="265" height="170" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:3.75s"/>
    <text class="ce-mono" x="22" y="36" font-size="11.5" letter-spacing="2.6" fill="#00D9FF">TRINITY</text>
