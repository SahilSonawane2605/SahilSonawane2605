<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ce-t ce-d">
  <title id="ce-t">Milestones &amp; Hackathon Participations — Sahil Sonawane</title>
  <desc id="ce-d">Smart India Hackathon (participated twice, selected for 2nd round); Faraway Hackathon (pre-final qualifier); InnovateX at IIT Bombay Techfest 2026 (Mumbai zonals); Aavishkar (university 2nd round); Codemble participant; Computer Engineering student at Trinity College of Engineering, Pune; Research in Agentic Learning Digital Twins; Team Leader across hackathons.</desc>
  <defs>
    <linearGradient id="ce-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161B22"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <radialGradient id="ce-glow" cx="15%" cy="100%" r="70%"><stop offset="0" stop-color="#7C3AED" stop-opacity=".4"/><stop offset="1" stop-color="#0D1117" stop-opacity="0"/></radialGradient>
    <linearGradient id="ce-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00FFA3"/><stop offset=".5" stop-color="#00D9FF"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .ce-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ce-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ce-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ce-tile { animation: ce-in 1s cubic-bezier(.34,1.3,.64,1) both; }
    .ce-edge { stroke-dasharray: 870; stroke-dashoffset: 870; animation: ce-edge 6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes ce-in { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes ce-edge { 0% { stroke-dashoffset: 870; opacity: 1; } 40% { stroke-dashoffset: 0; opacity: 1; } 60%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ce-tile { animation: none; } .ce-edge { display: none; } }
  </style>
  <rect width="1200" height="420" rx="20" fill="url(#ce-bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#ce-glow)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="19.5" fill="none" stroke="#30363D" stroke-opacity=".7"/>

  <!-- Tile 1: SIH -->
  <g class="ce-tile" style="animation-delay:0.20s"><g transform="translate(40 40)">
    <rect width="265" height="170" rx="14" fill="#161B22" stroke="#30363D"/>
    <rect width="265" height="170" rx="14" fill="none" stroke="url(#ce-edge)" stroke-width="1.2" class="ce-edge" style="animation-delay:2.00s"/>
    <text class="ce-mono" x="22" y="36" font-size="11.5" letter-spacing="2.6" fill="#00D9FF">SIH</text>
    <circle cx="238" cy="31" r="3.5" fill="#00FFA3"/><circle cx="227" cy="31" r="3.5" fill="#00FFA3"/>
    <line x1="22" y1="54" x2="243" y2="54" stroke="#30363D"/>
    <text class="ce-sans" x="22" y="86" font-size="14" fill="#F0F6FC">Smart India Hackathon</text>
    <text class="ce-sans" x="22" y="108" font-size="14" fill="#F0F6FC">Participated Twice —</text>
    <text class="ce-sans" x="22" y="130" font-size="14" fill="#00FFA3">Selected for 2nd Round</text>
  </g></g>

