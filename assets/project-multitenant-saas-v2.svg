<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p4-t">
  <title id="p4-t">Anti-Sleep Alarm for Drivers: Arduino-based prototype using IR sensor, buzzer, and relay.</title>
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B22"/><stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="p4-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".6"/><stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p4-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#00D9FF" stroke-opacity=".06"/>
    </pattern>
    <filter id="p4-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p4-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p4-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00FFA3"/><stop offset=".45" stop-color="#00D9FF"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p4-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p4-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p4-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p4-in { animation: p4-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p4-d1 { animation-delay: .15s; } .p4-d2 { animation-delay: .4s; }
    .p4-chip { animation: p4-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p4-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p4-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p4-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p4-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p4-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-in, .p4-chip { animation: none; } .p4-draw { animation: none; stroke-dashoffset: 0; } }
    .p4-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p4-trace 7s linear infinite; }
    @keyframes p4-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-trace { display: none; } }
  </style>
  <g clip-path="url(#p4-clip)">
    <rect width="1200" height="370" fill="url(#p4-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p4-grid)"/>
    <rect width="1200" height="370" fill="url(#p4-glow)"/>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#30363D" stroke-opacity=".8"/>
    <rect class="p4-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p4-trace)" stroke-width="1.8" stroke-linecap="round"/>
    <g class="p4-in p4-d1">
      <text class="p4-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#00D9FF">04 · EMBEDDED SYSTEMS · HARDWARE PROTOTYPE · 2026</text>
      <text class="p4-serif" x="54" y="126" font-size="46" font-weight="300" letter-spacing="-1.5" fill="#F0F6FC">Anti-Sleep Alarm for Drivers</text>
      <text class="p4-sans" x="56" y="166" font-size="17" fill="#8B949E">Arduino-based prototype using an IR sensor, buzzer, and relay to trigger alerts.</text>
      <text class="p4-mono" x="56" y="200" font-size="12.5" fill="#00FFA3"><tspan fill="#00D9FF">BUILT ›</tspan> IR sensor loop, buzzer alert trigger, relay safety switch &amp; threshold detection</text>
      <line class="p4-draw" x1="56" y1="226" x2="680" y2="226" stroke="#30363D" stroke-width="1.2"/>
    <g transform="translate(56 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#F0F6FC">IR Sensor</text><text class="p4-sans" y="24" font-size="12.5" fill="#8B949E">configured condition detection</text></g>
    <g transform="translate(261 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#F0F6FC">Buzzer</text><text class="p4-sans" y="24" font-size="12.5" fill="#8B949E">immediate audible alert</text></g>
    <g transform="translate(466 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#F0F6FC">Relay</text><text class="p4-sans" y="24" font-size="12.5" fill="#8B949E">hardware cut-off trigger</text></g>
      <g class="p4-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="75" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p4-mono" x="93" y="331" text-anchor="middle" font-size="11.5" fill="#00D9FF">Arduino</text></g>
      <g class="p4-chip" style="animation-delay:1.12s"><rect x="139" y="314" width="115" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p4-mono" x="196" y="331" text-anchor="middle" font-size="11.5" fill="#00D9FF">Embedded C++</text></g>
      <g class="p4-chip" style="animation-delay:1.24s"><rect x="262" y="314" width="85" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p4-mono" x="304" y="331" text-anchor="middle" font-size="11.5" fill="#00D9FF">IR Sensor</text></g>
      <g class="p4-chip" style="animation-delay:1.36s"><rect x="355" y="314" width="70" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p4-mono" x="390" y="331" text-anchor="middle" font-size="11.5" fill="#00FFA3">Buzzer</text></g>
      <g class="p4-chip" style="animation-delay:1.48s"><rect x="433" y="314" width="60" height="26" rx="13" fill="#161B22" stroke="#30363D"/><text class="p4-mono" x="463" y="331" text-anchor="middle" font-size="11.5" fill="#00D9FF">Relay</text></g>
    </g>
    <!-- Right side illustration: Hardware Circuit Loop -->
    <g class="p4-in p4-d2"><g transform="translate(0 35)">
      <g transform="translate(760 30)">
        <text class="p4-mono" x="20" y="24" font-size="10.5" letter-spacing="2.4" fill="#8B949E">HARDWARE CONTROL LOOP</text>
        <!-- IR Sensor Unit -->
        <g transform="translate(20 50)">
          <rect width="90" height="70" rx="10" fill="#161B22" stroke="#00D9FF" stroke-width="1.2"/>
          <circle cx="45" cy="30" r="12" fill="#0D1117" stroke="#00D9FF"/>
          <circle cx="45" cy="30" r="4" fill="#EF4444"/>
          <text class="p4-mono" x="45" y="58" font-size="10" text-anchor="middle" fill="#00D9FF">IR SENSOR</text>
        </g>
        <!-- Arrow 1 -->
        <path d="M110 85 H150" stroke="#00FFA3" stroke-width="1.5" stroke-dasharray="3 3"/>
        <!-- Arduino MCU Unit -->
        <g transform="translate(150 40)">
          <rect width="110" height="90" rx="10" fill="#0D1117" stroke="#7C3AED" stroke-width="1.8"/>
          <text class="p4-mono" x="55" y="40" font-size="12" text-anchor="middle" fill="#00FFA3">ARDUINO</text>
          <text class="p4-mono" x="55" y="60" font-size="9.5" text-anchor="middle" fill="#8B949E">Threshold MCU</text>
          <circle cx="20" cy="75" r="3" fill="#00FFA3"/>
          <circle cx="35" cy="75" r="3" fill="#00D9FF"/>
          <circle cx="50" cy="75" r="3" fill="#7C3AED"/>
        </g>
        <!-- Arrow 2 to Buzzer -->
        <path d="M260 70 H300" stroke="#00FFA3" stroke-width="1.5"/>
        <!-- Buzzer Unit -->
        <g transform="translate(300 45)">
          <rect width="90" height="40" rx="8" fill="#161B22" stroke="#30363D"/>
          <text class="p4-mono" x="45" y="25" font-size="10" text-anchor="middle" fill="#F0F6FC">BUZZER</text>
        </g>
        <!-- Arrow 3 to Relay -->
        <path d="M260 100 H300" stroke="#00D9FF" stroke-width="1.5"/>
        <!-- Relay Unit -->
        <g transform="translate(300 95)">
          <rect width="90" height="40" rx="8" fill="#161B22" stroke="#30363D"/>
          <text class="p4-mono" x="45" y="25" font-size="10" text-anchor="middle" fill="#00D9FF">RELAY</text>
        </g>
        <!-- Status indicator -->
        <g transform="translate(20 160)">
          <rect width="370" height="30" rx="8" fill="#161B22" stroke="#30363D"/>
          <circle cx="16" cy="15" r="4" fill="#00FFA3">
            <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
          </circle>
          <text class="p4-mono" x="30" y="19" font-size="10" fill="#8B949E">State: MONITORING · Configured Trigger Condition Armed</text>
        </g>
      </g>
    </g></g>
  </g>
</svg>
